<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nonograms / Picross | Logic Puzzle Game</title>
    <meta name="description" content="Solve nonogram puzzles by filling grids to match row and column number clues. Features smooth drag painting and contradiction detection." />
    <meta name="theme-color" content="#f6f7fb" />
    <link rel="icon" href="/games/nonograms/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" id="puzzleStyles" href="/games/nonograms/style.css" data-local="style.css" />
</head>
<body>
    <main class="app-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Logic puzzle</p>
                <h1>Nonograms / Picross</h1>
                <p>Fill the grid so every row and column matches its numbers. Numbers show contiguous blocks of filled squares in the order they must appear.</p>
            </div>
        </header>
        <section class="controls" aria-label="Puzzle controls">
            <div class="difficulty-filters">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="easy">Easy</button>
                <button type="button" class="filter-btn" data-filter="medium">Medium</button>
                <button type="button" class="filter-btn" data-filter="hard">Hard</button>
                <button type="button" class="filter-btn" data-filter="expert">Expert</button>
            </div>
            <label>
                Puzzle
                <select id="puzzlePicker" aria-label="Choose a Nonogram puzzle"></select>
            </label>
            <div class="control-buttons">
                <button type="button" id="resetPuzzle">Reset</button>
                <button type="button" id="newShuffled">Shuffle</button>
                <button type="button" id="hintButton" class="hint-btn">
                    <span class="hint-icon">💡</span> Get Hint
                </button>
            </div>
            <label class="checkbox">
                <input type="checkbox" id="autoMark" checked />
                Auto-mark solved lines
            </label>
        </section>
        <section class="stats-bar" aria-label="Puzzle statistics">
            <div class="stat-item">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="timer">0:00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Moves</span>
                <span class="stat-value" id="moveCounter">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Hints</span>
                <span class="stat-value" id="hintCounter">0</span>
            </div>
            <div class="stat-item" id="bestTimeDisplay" style="display: none;">
                <span class="stat-label">Best</span>
                <span class="stat-value" id="bestTime">--</span>
            </div>
        </section>
        <section class="tools" aria-label="Painting tools">
            <button type="button" class="tool active" data-tool="fill" aria-pressed="true">Fill</button>
            <button type="button" class="tool" data-tool="mark" aria-pressed="false">Mark Empty</button>
            <button type="button" class="tool" data-tool="clear" aria-pressed="false">Clear</button>
        </section>
        <section class="puzzle-shell">
            <div class="corner" aria-hidden="true">
                <p id="statusLine">Drag to paint. Auto-marking keeps contradictions obvious.</p>
            </div>
            <div class="column-hints" id="columnHints" aria-label="Column hints"></div>
            <div class="row-hints" id="rowHints" aria-label="Row hints"></div>
            <div class="grid" id="grid" role="grid" aria-label="Nonogram grid"></div>
        </section>
        <section class="legend">
            <span class="legend-item filled">Filled</span>
            <span class="legend-item marked">Empty</span>
            <span class="legend-item contradiction">Contradiction</span>
        </section>
    </main>
    <script type="module" id="puzzleModule" src="/games/nonograms/app.js" data-local="app.js"></script>
    <script>
        if (window.location.protocol === "file:") {
            const style = document.getElementById("puzzleStyles");
            if (style && style.dataset.local) {
                style.href = style.dataset.local;
            }
            const moduleScript = document.getElementById("puzzleModule");
            if (moduleScript && moduleScript.dataset.local) {
                const fallback = document.createElement("script");
                fallback.type = "module";
                fallback.src = moduleScript.dataset.local;
                document.body.appendChild(fallback);
                moduleScript.remove();
            }
        }
    </script>
</body>
</html>
